# Alpamayo 1.5 -> Cosmos 3 Edge distillation
# Single-GPU profile, 5k curated clips. Teacher swapped from Alpamayo 2 Super
# (34B, ~68GB bf16) to Alpamayo 1.5 (11.08B, 22.16GB bf16) to fit the available
# RTX GPU. See DECISIONS.md D-018..D-023.

paths:
  # Storage split per slurm_tutorial/08-storage.md, which is prescriptive:
  #   ~/            code only
  #   /bulk/users/  own data - the 7.3TB disk, no power-loss protection, 500GB quota
  #   /data/<user>/ results and checkpoints - the power-loss-protected OS disk
  # Model weights are re-downloadable, so they live on /bulk. The label cache is
  # NOT: regenerating it is ~21h of GPU + network, so it sits on /data despite
  # being "generated" data. Clips are still streamed, never materialised (D-019).
  dataset_root: /bulk/users/vla/alpamayo2edge/data/physicalai-av
  cache_root: /bulk/users/vla/alpamayo2edge/distill_cache
  runs_root: /data/vla/alpamayo2edge/runs
  # Local snapshot of nvidia/Alpamayo-1.5-10B (21 GB, 5 shards). from_pretrained takes
  # a path, so this skips the re-download. Its config.json still points
  # vlm_name_or_path at nvidia/Cosmos-Reason2-8B, whose processor/tokenizer are
  # fetched into HF_HUB_CACHE - weights are not, they are in the shards below.
  teacher_repo: /bulk/users/vla/alpamayo2edge/teacher-model
  # Local snapshot of nvidia/Cosmos3-Edge, pinned at revision a9d944e2 (8.6 GB,
  # downloaded 2026-08-28). Deliberately a local dir, not an HF repo id: an
  # untrained checkpoint the retention baseline is measured against must not move
  # under us, and it keeps the load path off the network entirely.
  student_repo: /bulk/users/vla/alpamayo2edge/cosmos3-edge

data:
  num_clips: 5000
  increments: [500, 2000, 5000]              # incremental labeling / scaling-curve points
  windows_per_clip: 2                        # training windows sampled per 20s clip
  # 4-camera reference set = the Alpamayo 1.5 load_physical_aiavdataset default and the
  # configuration NVIDIA's own ablation notebook tops out at (D-023). All 7 ring cameras
  # remain addressable (camera index map covers 0..6) if we ever want the ablation.
  # RUN 5: single camera. NVIDIA's own camera-number ablation
  # (alpamayo1.5/notebooks/inference_cam_num.ipynb) defines exactly this as its
  # "1 cam" configuration, and its configs nest 1 (front wide) subset 2 (+ front
  # tele) subset 4 - so front wide is the vendor's base, and `+ front_tele_30fov`
  # is the principled next rung if one view proves too little. `front_wide_120fov`
  # is also the only entry whose CAMERA_DISPLAY_NAME is the plain "Front camera"
  # (student/prompt.py), which is the label the model was trained to read.
  #
  # The 4-camera labels are REUSED as-is - no relabelling (measured, 2395 cached
  # CoC traces): 80.1% are anchored to ahead/our-lane, 14.7% use left/right as an
  # EGO MANEUVER direction ("turn right"), and only 0.7% reference a side object
  # with no ahead-anchor. For comparison 0.9% say "behind", which the 4-camera set
  # could not see either (it has no rear camera) and run 253 trained through
  # without trouble. Trajectory targets from a wider-view teacher are privileged
  # distillation, which is standard and if anything raises target quality.
  cameras: [camera_front_wide_120fov]
  context_frames: 4                          # frames per camera (teacher convention)
  student_resolution: [360, 640]             # Edge control resolution (H, W)
  # Write the student's own inputs (JPEG frames + ego history) during the
  # labeling pass, which already loads every window. Without this, stage-1
  # training re-streams every clip once per epoch.
  # Size: 10k windows x 16 frames (4 cameras x 4) at 360x640 q92. Measured
  # bounds on synthetic 360x640: 14 KB/frame smooth, 220 KB/frame pure noise;
  # real road footage sits nearer the low end, so expect single-digit to low
  # tens of GB, NOT the ~105GB the same frames would take uncompressed.
  cache_student_frames: true
  frame_jpeg_quality: 92                     # raise toward 100 if artifacts show
                                             # in the vision tower's features
  split:
    holdout_countries: [JPN, ZAF]            # geographic test holdout - never trained on
    val_fraction: 0.05
    debug_clips: 100
  curation:
    # Stratified oversampling of long-tail scenarios. Weights multiply base
    # sampling probability for clips whose metadata/first-pass teacher labels match.
    strata_weights:
      # NB: the teacher-meta-action bootstrap path is gone - Alpamayo 1.5 has no
      # meta-action head (D-021). Strata are metadata-only; cut_in is unreachable
      # until a replacement signal exists.
      intersection: 3.0
      pedestrian: 3.0
      cut_in: 4.0
      construction: 4.0
      adverse_weather: 2.0
      night: 2.0
      default: 1.0

teacher:
  dtype: bf16                                # validate fp8 against bf16 on debug split first
  max_coc_tokens: 48                         # short-CoC budget == student deployment context
  topk_logits: 32
  flow_targets_per_window: 12                # K stratified (t, x_t, u_teacher) tuples (D-007/012)
  timestep_stratification: uniform           # uniform bins over [0, 0.999); t = data weight
                                             # (D-012; cap is now our choice, D-020)
  n_traj_samples: 4                          # sampled continuous trajectories (sanity/eval)
  expert_batch: 4                            # KV batch for expert forwards (memory-bound)
  # Window-level fetch concurrency. Streaming is network-bound and the teacher is
  # GPU-bound, so they overlap: the first live run measured 30 s/window at 20% GPU
  # utilisation, i.e. ~24 s of streaming per ~6 s of teacher. NVIDIA's
  # load_physical_aiavdataset fetches its cameras serially inside one call, so the
  # concurrency has to be per window, not per camera. Past ~4 the teacher is the
  # floor and more workers only add memory. Set to 1 for a serial run when debugging.
  prefetch_workers: 4
  prefetch_depth: 6                          # windows in flight; the memory knob,
                                             # each holds decoded frames
  gen_top_p: 0.98                            # teacher release inference defaults
  gen_temperature: 0.6
  feat_layers: [3, 8, 12, 17, 21, 26, 30, 35]   # cached teacher layers (feature KD / CKA, D-008)
                                             # re-spaced over A1.5's 36 layers (was 64, D-019)
  feat_pool_len: 8                           # mean-pool segments per cached layer

student:
  # D-024: capability transfer, not compression - both stages adapt through LoRA.
  # See TRAINING_STRATEGY.md §2. Injection is scoped to the decoder-layer stack;
  # targets are matched by cosmos-framework's inject_lora_pre_fsdp (plain leaf
  # names, and the `_moe_gen` suffix is what makes a target gen-tower-only).
  lora:
    stage1:                                  # AR/reasoner tower
      enabled: true                          # false = full-FT ablation; does NOT
                                             # fit 48GB (43.5GB of states before
                                             # activations) - 500-clip diagnostic only
      rank: 48                               # RUN 6: back from 96 (runs 4-5), TOGETHER with the
                                             # targets below - 232's exact setting, so the
                                             # comparison is one change. r96+MLP was adopted on
                                             # the confounded comparison recorded below, and the
                                             # metric that can now see the CoC says it hurt:
                                             # best val CoC NLL 0.455 at r48 attention-only (job
                                             # 232) vs 0.509 / 0.536 at r96+MLP (jobs 253 / 313),
                                             # 19.3M -> 99.1M adapter params, the NLL peak moving
                                             # from epoch 2 to epoch 1, and a 0.115-0.147
                                             # train->val maneuver-accuracy gap on free-running
                                             # CoC (05b_eval_coc.py, D-036). Capacity/data
                                             # mismatch is the simplest reading; this run tests it.
                                             # ---- history of the r96 decision, for the record:
                                             # Job 243 (r96 + MLP targets) reached 2.414 m; job
                                             # 232 (r48, attention-only) reached 2.463 m. Those
                                             # runs differ in THREE ways, not one: rank, targets
                                             # (19.3M -> 99.1M adapter params), and dataset size
                                             # - 243 ran 240 steps on ~500 clips (30 steps/epoch)
                                             # while 232 ran ~4140 on the full 9477-clip split
                                             # (593 steps/epoch). 243 got the better gate from
                                             # 1/20th the data and 1/20th the steps, which is
                                             # suggestive but attributable to none of the three.
                                             # Kept because it is the better number we have and
                                             # the base stays frozen either way (no full-FT
                                             # forgetting risk). Run 4 was the first full-data run
                                             # at those settings; run 6 is the ablation it owed.
      alpha: 96                              # 2x rank, the framework's own ratio - scaled with rank
      targets: [q_proj, k_proj, v_proj, o_proj]
      # RUN 6: attention-only again. mlp.up_proj / mlp.down_proj (path-qualified -
      # the leaf names are shared with the gen tower) were runs 4-5's addition and
      # revert with the rank; see the rank comment.
    stage2:                                  # generation/diffusion tower
      enabled: true
      rank: 16                               # Cosmos3-Edge.yaml's shipped default
      alpha: 32
      targets: [q_proj_moe_gen, k_proj_moe_gen, v_proj_moe_gen, o_proj_moe_gen]
    train_shared_action_embeds: false        # action_modality_embed + time_embedder are
                                             # shared by all 32 embodiments: a forgetting
                                             # channel no row mask covers. Keep off.
  new_token_lr_mult: 8.0                     # trajectory rows, action-domain rows, projections
  action_domain_id: 31                       # new embodiment domain slot for the teacher's
                                             # accel/curvature space (D-017); verify unused
  layer_map:
    mode: cka                                # cka primary; uniform demoted to baseline (D-008)
    cka_probe_batches: 4                     # stage-1 batches used to probe the mapping,
                                             # measured on the UNTRAINED student before
                                             # step 0 (was cka_probe_clips, which nothing
                                             # read - the trainer hardcoded uniform)

stage1:
  epochs: 12                                 # run 4: was 8. A CEILING, not a target - on full data
                                             # `early_stop_patience` is what actually ends the run.
                                             # Job 232, the only full-data run at these settings,
                                             # early-stopped at epoch 6 with its best at epoch 3,
                                             # so 8 was already not binding. 12 exists because run
                                             # 4 reshapes the trajectory supervision and the
                                             # overfit onset may move later; it costs nothing if it
                                             # does not. (An earlier version of this comment cited
                                             # job 243 "still improving at the cap" - that was the
                                             # ~500-clip diagnostic, 240 total steps, undertrained
                                             # rather than unconverged. It says nothing about where
                                             # a full-data run peaks.)
                                             # Budget: 9477 train clips -> 593 steps/epoch at
                                             # ~3.8 h/epoch (measured, job 232) -> 45.6 h for the
                                             # full 12, inside the 68 h the sbatch now asks for.
  micro_batch: 4                             # was 2 under full FT; LoRA freed ~35GB (D-024).
  grad_accum: 8                              # effective batch held at 32. Raise micro_batch
                                             # further once the first run reports real usage.
  lr: 3.0e-4                                 # run 2: was 1.0e-4 (inherited from full-FT). Run 1
                                             # plateaued at epoch 3 then overfit; LoRA wants 2-5x
                                             # more (D-026, eval_phase1.md §3). Primary gate-facing
                                             # lever for run 2 - keep the rest fixed to attribute it.
  warmup_frac: 0.03
  weight_decay: 0.05
  # false because the model cannot do it, not because we don't want it.
  # Nemotron3DenseVLTextForCausalLM inherits supports_gradient_checkpointing=True
  # from PreTrainedModel but no module implements the `gradient_checkpointing`
  # attribute, so transformers' gradient_checkpointing_enable() raises outright
  # (it happens to succeed AFTER LoRA injection, because the adapter modules carry
  # the attribute - which is why the smoke test missed this and the trainer did
  # not). Either way it is a NO-OP: _impl_reasoner_forward calls
  # decoder_layer.reasoner_forward directly and never routes through a checkpoint
  # function. Measured peak is 58.3 GiB at micro_batch 4, which is the
  # UNCHECKPOINTED cost and fits the 96GB Blackwell. The framework's own mechanism
  # is config.activation_checkpointing.mode, which Cosmos3OmniModel.__init__ forces
  # to "none"; wiring that up is the real fix and is stage-2 work.
  grad_checkpoint: false
  # Run 4 splits the teacher's trajectory KL by ACTION DIM and makes the GT
  # anchor distance-aware. Measured on the cache (400 clips, 102k trajectory
  # positions, no GPU): teacher probability mass within +/-w bins of the GT bin,
  # over the 3000-bin future region --
  #
  #                +/-2    +/-10   +/-20   +/-100
  #   curvature    0.420   0.708   0.806   0.931
  #   accel        0.028   0.094   0.170   0.577
  #
  # The teacher's path shape is worth distilling; its speed profile is close to
  # uninformative about GT even at a +/-100-bin tolerance. That - not the
  # trajectory KL as a whole - is what has been fighting `gt_ce`, and it is
  # exactly half the token stream. Teacher minADE is 1.7 m, so its trajectory is
  # a ceiling we do not want to inherit whole; its CoC is not, hence text_kl and
  # struct_ce below are untouched.
  loss_weights:
    traj_kl: 1.0                             # EVEN positions = curvature (D-031 emission
                                             # order, re-verified against `gt_traj`'s columns
                                             # at r = 0.999/1.000). Held at 1.0: this half of
                                             # the teacher is good and is the low-variance
                                             # signal that taught runs 1-3 the token geometry.
    traj_kl_accel: 0.1                       # run 4, NEW: ODD positions = accel. 10x down, not
                                             # 0: it still regularises against the one-sample
                                             # variance of the GT anchor, and job 243 was never
                                             # teacher-limited (it stopped at the epoch cap
                                             # still improving, 2.456 -> 2.414, not at 1.7).
    text_kl: 1.0                             # run 2: was 0.5. Run-1 CoC content was already
                                             # on-topic (job 202) - the real problem was
                                             # termination (see struct_ce) not content, so
                                             # 2x not 4x. UNCHANGED in run 4: this is the
                                             # teacher signal we are keeping. Do not raise it -
                                             # 243 drove train `text` to 0.003 while val CoC NLL
                                             # ROSE 0.648 -> 0.921, i.e. the CoC is already
                                             # overfitting and more weight makes that worse.
    feat: 0.0                                # RUN 5: OFF, and this one is forced by the camera
                                             # change rather than chosen. Feature KD pools the
                                             # student's prompt into `feat_pool_len` segments
                                             # (pool_prompt_segments) and compares them to the
                                             # teacher's cached 8 - but the cached segments span
                                             # 16 image groups (4 cameras x 4 frames) and a
                                             # 1-camera student's span 4, so the two no longer
                                             # cover the same content and the match is noise.
                                             # Nothing is lost: D-033 found feature KD inert and
                                             # run 253 confirmed it on full data (decayed 0.179
                                             # -> 0.029, ~0.5% of the loss). Restore to 0.5 only
                                             # together with a re-labelling pass at 1 camera.
    gt_ce: 0.0                               # RUN 5: OFF. Ground truth moves to phase 2 (user,
                                             # 2026-09-12), so stage 1 is now PURE teacher
                                             # distillation - traj_kl + text_kl + struct_ce and
                                             # nothing else. `gt_ce_end` is deleted below, not
                                             # just zeroed here: stage_weights ramps `gt_ce`
                                             # TOWARD `gt_ce_end`, so leaving the end weight at
                                             # 1.5 would ramp 0.0 -> 1.5 and reintroduce the term
                                             # it is meant to remove.
                                             # Applies to the SOFT target (losses.gt_traj_soft_ce);
                                             # `gt_soft` and `gt` both keep logging under no_grad
                                             # so run 5's curve stays readable against 253's.
                                             # CONSEQUENCE, flagged not hidden: nothing now
                                             # supervises the speed profile. D-035 measured the
                                             # teacher's accel mass at 2.8% within +/-2 bins of
                                             # the GT bin, which is why `traj_kl_accel` is down at
                                             # 0.1 - so accel supervision in run 5 is 0.1x a
                                             # near-uninformative target. Expect the gate
                                             # (minADE, a GT metric) to WORSEN against 253's
                                             # 2.232 m; that is the trade, not a regression.
    struct_ce: 0.5                           # run 2, NEW: CE on the `<|cot_end|>` +
                                             # `<|traj_future_start|>` subword positions. Run 1
                                             # never supervised these, so the student could not
                                             # terminate its CoC and fell back to the base
                                             # model's `</think>` (job 202). eval_phase1.md §1.
                                             # UNCHANGED in run 4 (already 0.000 by epoch 2).
  # RUN 5: `gt_ce_end` DELETED (was 1.5, run 4's upward ramp). With `gt_ce: 0.0`
  # above, stage_weights would otherwise ramp the GT anchor straight back in.
  # Do not reinstate either key without the other. The old `gt_ce_min` fallback
  # name must stay absent for the same reason.
  gt_soft_sigma_bins: 6.0                    # run 4, NEW: sigma of the Gaussian the GT anchor
                                             # targets, in bins, truncated at +/-3 sigma and
                                             # renormalised at the region edges. 6 bins is well
                                             # inside the +/-10 window where the teacher already
                                             # concentrates 71% of its curvature mass, so it
                                             # sharpens rather than blurs what runs 1-3 learned.
                                             # NB the logged `gt_soft` floors at the target's own
                                             # entropy, ~3.21 nats - NOT 0, and not comparable to
                                             # 243's ~6.0. The `gt` term logs the old one-hot CE
                                             # untrained, for exactly that comparison.
  feat_warmup_frac: 0.1
  select_on: coc_nll                         # RUN 5, NEW: which metric picks the best
                                             # checkpoint and drives early stop.
                                             # `coc_nll` | `minade` (runs 1-4 behaviour).
                                             # minADE is a pure-GT metric and run 5 took
                                             # `gt_ce` out of the loss, so selecting on it
                                             # would optimise for something stage 1 no
                                             # longer trains toward - the CoC is what this
                                             # phase delivers. It is also the noisier of
                                             # the two: measured 2.317 +/- 0.078 m over
                                             # three seeds on ONE fixed checkpoint
                                             # (runs/camera_ablation/4cam-baseline.json),
                                             # because the gate samples k modes at
                                             # temperature without seeding. `_coc_nll` is
                                             # teacher-forced CE - deterministic.
                                             # Job 253 is the cautionary case: its best
                                             # CoC (0.509, epoch 2) was never saved because
                                             # 2.850 m did not beat the epoch-0 minADE.
                                             # minADE is still computed and logged every
                                             # epoch regardless of this setting.
  early_stop_patience: 3                     # run 2: was 2. Run-1 peak was epoch 3/6 on a
                                             # noisy gate; a higher lr may move it. (evals
                                             # without `select_on` improvement - coc_nll since
                                             # run 5, NOT coarse-minADE)
  # RUN 6, NEW: maneuver-stratified sampling (D-036, data/sampling.py). Uniform
  # sampling hands the student the teacher's maneuver MARGINAL - FOLLOW 32.9% +
  # KEEP 20.8% = 54% of the CoC gradient, LANE_CHANGE 2.1% - and 05b_eval_coc.py
  # measured what that buys: LANE_CHANGE emitted at 11% of the teacher's rate, and
  # silence on direction in ~48% of the windows where the teacher commits to one,
  # on train AND val - no gap, so never learned rather than overfit. Each window
  # is drawn with probability ~ (1/freq of its teacher maneuver class)^alpha, the
  # class parsed from the cached coc_text (eval/coc_score.maneuver, 98.7%
  # assignable; the rest draw at the uniform rate). alpha 0.5 is square-root
  # tempering: LANE_CHANGE 2.1% -> 5.1%, FOLLOW 32.9% -> 20.3%. NOT 1.0 - full
  # inversion repeats the 415 LANE_CHANGE windows ~16x per epoch, which is the
  # memorisation we are already fighting. Draws per epoch = len(train split),
  # with replacement: steps/epoch unchanged. Over-correction shows up in the eval
  # as object PRECISION falling and the val maneuver mix overshooting the
  # teacher's, not just recall rising - read both.
  maneuver_sampling:
    enabled: true
    alpha: 0.5

# PHASE 1.5 (D-037): GRPO on the AR tower's chain-of-causation. Separate from
# phase 2's DiffGRPO on the flow head. Why RL here at all: `text_kl` is hard-label
# CE on ONE sampled teacher trace, and 05c/05b measured the student holding only
# ~0.1-0.25 on the teacher's verb where the teacher commits (nudge / adapt / lane
# change) - an under-sharpened conditional that CE cannot sharpen and that
# group-relative reward can. It is also how the teacher got its own CoC
# (Alpamayo 1.5: RL with a reasoning reward on the chain-of-causation).
# Runs on one GPU, no vLLM: 2B student, ~14-token rollouts, cache-only inputs.
#   python -m distill.train_grpo_coc --smoke        # Ada, ~15 min
#   sbatch scripts/03c_grpo_coc.sh                  # Blackwell
stage1_rl:
  init_ckpt: /data/vla/alpamayo2edge/runs/stage1/run-314/best   # the policy AND the reference
  run_name: rl-run-1
  group_size: 16                             # G rollouts per prompt. Was 8 (recipe: 12): job
                                             # 315's first steps skipped 69-81% of groups as
                                             # zero-variance at G=8, uniform prompts, 35 s/step.
                                             # Doubling G is the cheapest way to buy variance.
  prompts_per_step: 16                       # 16 x 16 = 256 sequences per optimizer step
  prompt_alpha: 0.5                          # draw prompts ~ (1/freq of teacher maneuver)^alpha
                                             # (data/sampling.py, run 6's weights). For GRPO this
                                             # is efficiency, not bias: advantages are within-group,
                                             # so it only changes WHICH groups exist, not what a
                                             # group teaches. 0 = uniform.
  steps: 500                                 # ~35 s/step measured at G=8; expect ~60 s at G=16
  lr: 1.0e-5                                 # RL, not SFT: LoRA at 3e-4 would leave the
                                             # reference in a few steps and the KL would not hold it
  grad_clip: 1.0
  kl_beta: 0.03                              # k3 estimator against the adapters-off reference
  ce_aux: 0.1                                # the existing teacher-forced CE as an anchor:
                                             # the grader is rule-based and a student CAN learn a
                                             # magic phrase; this plus the KL is what stops it
  temperature: 0.6                           # rollouts at the setting the student is judged at
  top_p: 0.98                                #   (teacher release defaults, 05b's defaults)
  max_new_tokens: 64
  eval_every: 25                             # free-running val check (maneuver acc, false-clear,
  eval_windows: 100                          #   precision, mix); best-by-maneuver-acc is saved
  seed: 0
  reward:                                    # rule grader = eval/coc_score against the cached trace
    maneuver: 1.0                            # canonical maneuver class agrees
    direction: 0.5                           # ego left/right/straight agrees (where the teacher states one)
    objects: 0.5                             # x object recall over hazard classes
    false_clear: 1.0                         # SUBTRACTED: teacher saw a hazard, student named none and proceeds
    fail: -1.0                               # no terminator, or longer than max_tokens
    max_tokens: 48                           # == teacher.max_coc_tokens

stage2:
  supervision: teacher_flow                  # teacher_flow (D-007) | gt_flow (ablation baseline)
  epochs: 8
  micro_batch: 8                             # was 4; same LoRA headroom as stage 1
  grad_accum: 4                              # effective batch held at 32
  lr: 5.0e-5
  warmup_frac: 0.03
  weight_decay: 0.0
  grad_checkpoint: true
  loss_weights:
    flow_distill: 1.0
    fm_gt: 0.5
  anneal_to_gt_frac: 0.2                     # last 20%: ramp fm_gt up, flow_distill down
  scheduled_sampling_start_frac: 0.5         # after 50%: condition on student-sampled traj tokens

eval:
  horizon_s: 6.4
  minade_k: 6
  # The gate decodes 128 tokens x minade_k modes per window at batch 1 (see
  # eval/coarse_minade.py for why batch 1), so it is minutes, not seconds. Cap
  # the window count to keep a per-epoch signal cheap; null = the whole split.
  gate_max_windows: 60
  challenging_split: challenging_v1          # NVIDIA's hard samples, held out from training
                                             # NOTE: unused - the PhysicalAI-AV metadata
                                             # carries no such flag, so split_challenging.json
                                             # is the long-tail STRATA of the val split
                                             # (data/splits.py). Rename or wire when a real
                                             # challenging-split id list exists.
  # Retention (D-025, TRAINING_STRATEGY §4): half the headline result, not hygiene.
  # Baseline is cached from the UNTRAINED Edge checkpoint once, so base and
  # trained never have to be resident together.
  retention:
    baseline_dir: /data/vla/alpamayo2edge/runs/retention_base
    probe_file: src/distill/eval/probes/general_probes.json
    max_new_tokens: 64
    # Gen-tower denoising retention on non-AV clips. Leave null to skip that
    # half with a warning; any directory of short mp4/webm clips works.
    generic_clips_dir: null
    n_generic_clips: 16
    flow_probe_timesteps: [0.1, 0.3, 0.5, 0.7, 0.9]
    seed: 0

# NOTE: no EMA anywhere by design (TRAINING_STRATEGY §3). NVIDIA's Edge recipe
# enables it, but that is an 8-GPU config with fsdp_master_dtype float32; here it
# would cost a full extra weight copy for no benefit at LoRA scale.
