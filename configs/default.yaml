# Alpamayo 1.5 -> Cosmos 3 Edge distillation
# Single-GPU profile, 5k curated clips. Teacher swapped from Alpamayo 2 Super
# (34B, ~68GB bf16) to Alpamayo 1.5 (11.08B, 22.16GB bf16) to fit the available
# RTX GPU. See DECISIONS.md D-018..D-023.

paths:
  # Storage split per slurm_tutorial/08-storage.md, which is prescriptive:
  #   ~/            code only
  #   /bulk/users/  own data - the 7.3TB disk, no power-loss protection, 500GB quota
  #   /data/<user>/ results and checkpoints - the power-loss-protected OS disk
  # Model weights are re-downloadable, so they live on /bulk. The label cache is
  # NOT: regenerating it is ~21h of GPU + network, so it sits on /data despite
  # being "generated" data. Clips are still streamed, never materialised (D-019).
  dataset_root: /bulk/users/vla/alpamayo2edge/data/physicalai-av
  cache_root: /bulk/users/vla/alpamayo2edge/distill_cache
  runs_root: /data/vla/alpamayo2edge/runs
  # Local snapshot of nvidia/Alpamayo-1.5-10B (21 GB, 5 shards). from_pretrained takes
  # a path, so this skips the re-download. Its config.json still points
  # vlm_name_or_path at nvidia/Cosmos-Reason2-8B, whose processor/tokenizer are
  # fetched into HF_HUB_CACHE - weights are not, they are in the shards below.
  teacher_repo: /bulk/users/vla/alpamayo2edge/teacher-model
  # Local snapshot of nvidia/Cosmos3-Edge, pinned at revision a9d944e2 (8.6 GB,
  # downloaded 2026-08-28). Deliberately a local dir, not an HF repo id: an
  # untrained checkpoint the retention baseline is measured against must not move
  # under us, and it keeps the load path off the network entirely.
  student_repo: /bulk/users/vla/alpamayo2edge/cosmos3-edge

data:
  num_clips: 5000
  increments: [500, 2000, 5000]              # incremental labeling / scaling-curve points
  windows_per_clip: 2                        # training windows sampled per 20s clip
  # 4-camera reference set = the Alpamayo 1.5 load_physical_aiavdataset default and the
  # configuration NVIDIA's own ablation notebook tops out at (D-023). All 7 ring cameras
  # remain addressable (camera index map covers 0..6) if we ever want the ablation.
  # RUN 5: single camera. NVIDIA's own camera-number ablation
  # (alpamayo1.5/notebooks/inference_cam_num.ipynb) defines exactly this as its
  # "1 cam" configuration, and its configs nest 1 (front wide) subset 2 (+ front
  # tele) subset 4 - so front wide is the vendor's base, and `+ front_tele_30fov`
  # is the principled next rung if one view proves too little. `front_wide_120fov`
  # is also the only entry whose CAMERA_DISPLAY_NAME is the plain "Front camera"
  # (student/prompt.py), which is the label the model was trained to read.
  #
  # The 4-camera labels are REUSED as-is - no relabelling (measured, 2395 cached
  # CoC traces): 80.1% are anchored to ahead/our-lane, 14.7% use left/right as an
  # EGO MANEUVER direction ("turn right"), and only 0.7% reference a side object
  # with no ahead-anchor. For comparison 0.9% say "behind", which the 4-camera set
  # could not see either (it has no rear camera) and run 253 trained through
  # without trouble. Trajectory targets from a wider-view teacher are privileged
  # distillation, which is standard and if anything raises target quality.
  # RUN 7: back to the 4 cameras the labels were made with. D-036: the CoC
  # collapse (FOLLOW/KEEP over-emitted, direction silent) is a perception limit -
  # the only arm that ever emitted LANE_CHANGE near the teacher's rate was run-253
  # at 4 cameras, and the 11B teacher handed one camera shows the same collapse
  # (D-037). Run 5's single-camera rationale is kept below for the record.
  cameras: [camera_cross_left_120fov, camera_front_wide_120fov, camera_cross_right_120fov,
            camera_front_tele_30fov]
  # cameras: [camera_front_wide_120fov]      # runs 5-6 (single camera)
  context_frames: 4                          # frames per camera (teacher convention)
  student_resolution: [360, 640]             # Edge control resolution (H, W)
  # Write the student's own inputs (JPEG frames + ego history) during the
  # labeling pass, which already loads every window. Without this, stage-1
  # training re-streams every clip once per epoch.
  # Size: 10k windows x 16 frames (4 cameras x 4) at 360x640 q92. Measured
  # bounds on synthetic 360x640: 14 KB/frame smooth, 220 KB/frame pure noise;
  # real road footage sits nearer the low end, so expect single-digit to low
  # tens of GB, NOT the ~105GB the same frames would take uncompressed.
  cache_student_frames: true
  frame_jpeg_quality: 92                     # raise toward 100 if artifacts show
                                             # in the vision tower's features
  split:
    holdout_countries: [JPN, ZAF]            # geographic test holdout - never trained on
    val_fraction: 0.05
    debug_clips: 100
  curation:
    # Stratified oversampling of long-tail scenarios. Weights multiply base
    # sampling probability for clips whose metadata/first-pass teacher labels match.
    strata_weights:
      # NB: the teacher-meta-action bootstrap path is gone - Alpamayo 1.5 has no
      # meta-action head (D-021). Strata are metadata-only; cut_in is unreachable
      # until a replacement signal exists.
      intersection: 3.0
      pedestrian: 3.0
      cut_in: 4.0
      construction: 4.0
      adverse_weather: 2.0
      night: 2.0
      default: 1.0

teacher:
  dtype: bf16                                # validate fp8 against bf16 on debug split first
  max_coc_tokens: 48                         # short-CoC budget == student deployment context
  topk_logits: 32
  flow_targets_per_window: 12                # K stratified (t, x_t, u_teacher) tuples (D-007/012)
  timestep_stratification: uniform           # uniform bins over [0, 0.999); t = data weight
                                             # (D-012; cap is now our choice, D-020)
  n_traj_samples: 4                          # sampled continuous trajectories (sanity/eval)
  expert_batch: 4                            # KV batch for expert forwards (memory-bound)
  # Window-level fetch concurrency. Streaming is network-bound and the teacher is
  # GPU-bound, so they overlap: the first live run measured 30 s/window at 20% GPU
  # utilisation, i.e. ~24 s of streaming per ~6 s of teacher. NVIDIA's
  # load_physical_aiavdataset fetches its cameras serially inside one call, so the
  # concurrency has to be per window, not per camera. Past ~4 the teacher is the
  # floor and more workers only add memory. Set to 1 for a serial run when debugging.
  prefetch_workers: 4
  prefetch_depth: 6                          # windows in flight; the memory knob,
                                             # each holds decoded frames
  gen_top_p: 0.98                            # teacher release inference defaults
  gen_temperature: 0.6
  feat_layers: [3, 8, 12, 17, 21, 26, 30, 35]   # cached teacher layers (feature KD / CKA, D-008)
                                             # re-spaced over A1.5's 36 layers (was 64, D-019)
  feat_pool_len: 8                           # mean-pool segments per cached layer

student:
  # D-024: capability transfer, not compression - both stages adapt through LoRA.
  # See TRAINING_STRATEGY.md §2. Injection is scoped to the decoder-layer stack;
  # targets are matched by cosmos-framework's inject_lora_pre_fsdp (plain leaf
  # names, and the `_moe_gen` suffix is what makes a target gen-tower-only).
  lora:
    stage1:                                  # AR/reasoner tower
      enabled: true                          # false = full-FT ablation; does NOT
                                             # fit 48GB (43.5GB of states before
                                             # activations) - 500-clip diagnostic only
      rank: 48                               # RUN 6: back from 96 (runs 4-5), TOGETHER with the
                                             # targets below - 232's exact setting, so the
                                             # comparison is one change. r96+MLP was adopted on
                                             # the confounded comparison recorded below, and the
                                             # metric that can now see the CoC says it hurt:
                                             # best val CoC NLL 0.455 at r48 attention-only (job
                                             # 232) vs 0.509 / 0.536 at r96+MLP (jobs 253 / 313),
                                             # 19.3M -> 99.1M adapter params, the NLL peak moving
                                             # from epoch 2 to epoch 1, and a 0.115-0.147
                                             # train->val maneuver-accuracy gap on free-running
                                             # CoC (05b_eval_coc.py, D-036). Capacity/data
                                             # mismatch is the simplest reading; this run tests it.
                                             # ---- history of the r96 decision, for the record:
                                             # Job 243 (r96 + MLP targets) reached 2.414 m; job
                                             # 232 (r48, attention-only) reached 2.463 m. Those
                                             # runs differ in THREE ways, not one: rank, targets
                                             # (19.3M -> 99.1M adapter params), and dataset size
                                             # - 243 ran 240 steps on ~500 clips (30 steps/epoch)
                                             # while 232 ran ~4140 on the full 9477-clip split
                                             # (593 steps/epoch). 243 got the better gate from
                                             # 1/20th the data and 1/20th the steps, which is
                                             # suggestive but attributable to none of the three.
                                             # Kept because it is the better number we have and
                                             # the base stays frozen either way (no full-FT
                                             # forgetting risk). Run 4 was the first full-data run
                                             # at those settings; run 6 is the ablation it owed.
      alpha: 96                              # 2x rank, the framework's own ratio - scaled with rank
      targets: [q_proj, k_proj, v_proj, o_proj]
      # RUN 6: attention-only again. mlp.up_proj / mlp.down_proj (path-qualified -
      # the leaf names are shared with the gen tower) were runs 4-5's addition and
      # revert with the rank; see the rank comment.
    stage2:                                  # generation/diffusion tower
      enabled: true
      rank: 16                               # Cosmos3-Edge.yaml's shipped default
      alpha: 32
      targets: [q_proj_moe_gen, k_proj_moe_gen, v_proj_moe_gen, o_proj_moe_gen]
    train_shared_action_embeds: false        # action_modality_embed + time_embedder are
                                             # shared by all 32 embodiments: a forgetting
                                             # channel no row mask covers. Keep off.
  new_token_lr_mult: 8.0                     # trajectory rows, action-domain rows, projections
  action_domain_id: 31                       # new embodiment domain slot for the teacher's
                                             # accel/curvature space (D-017); verify unused
  layer_map:
    mode: cka                                # cka primary; uniform demoted to baseline (D-008)
    cka_probe_batches: 4                     # stage-1 batches used to probe the mapping,
                                             # measured on the UNTRAINED student before
                                             # step 0 (was cka_probe_clips, which nothing
                                             # read - the trainer hardcoded uniform)

stage1:
  # RUN 7 (D-043, 2026-09-17): CoC from the teacher, trajectory from the DRIVER,
  # and the two coupled. Runs 5-6 trained the trajectory tokens on the teacher's
  # own token distribution (3.77 m ADE_1 on the gate windows, accel half near
  # uninformative - D-035/D-036) with `gt_ce: 0.0`, and the student sat on that
  # ceiling at 3.2-3.7 m. Run 4, the one run with a GT anchor, reached 2.23 m.
  # And D-040 measured that the trajectory never read the CoC at all: one
  # (CoC, trajectory) pair per window, both fixed by the same images, so the
  # trajectory head learned f(images). Four changes, each named below:
  #   traj_prefix: gt        GT bins are the teacher-forced prefix AND the target
  #   loss_weights           teacher trajectory KL off, gt_ce on (flat, no ramp)
  #   route_hint: true       the driver's direction in the <|route_start|> slot
  #   image_dropout: 0.3     trajectory read from CoC + history on 30% of samples
  #   filter_contradictions  windows whose CoC flatly contradicts GT are dropped
  epochs: 12                                 # a CEILING; early_stop_patience ends the run.
                                             # 4 cameras: ~3.8 h/epoch (job 232), full 12
                                             # = 45.6 h, inside the 68 h sbatch wall.
  micro_batch: 4                             # LoRA r48, 4 cameras: peak ~58 GiB (job 232).
  grad_accum: 8                              # effective batch 32.
  lr: 3.0e-4                                 # unchanged since run 2 (LoRA wants 2-5x full-FT).
  warmup_frac: 0.03
  weight_decay: 0.05
  # false because the model cannot do it, not because we don't want it:
  # Nemotron3DenseVLTextForCausalLM has no checkpoint path in reasoner_forward;
  # the framework's mechanism (config.activation_checkpointing.mode) is forced to
  # "none" by Cosmos3OmniModel.__init__. The uncheckpointed peak fits the 96 GB card.
  grad_checkpoint: false
  # Which trajectory stream is teacher-forced into the sequence at the 128 future
  # positions. "gt": the cached `gt_traj_token_ids` (the driver's future through
  # the teacher's tokenizer, dim-swapped, D-031), so `gt_ce` trains
  # p(GT bin t | GT bins < t). Run 4 trained a GT target on a TEACHER prefix - a
  # conditional the model is never asked for at decode time. "teacher" = runs 1-6.
  traj_prefix: gt
  # Fill `<|route_start|>...<|route_end|>` with the direction the driver took
  # (turn left / turn right / straight, `eval.gt_reward.route_hint`; val rates
  # 6.2% / 5.8% / 88%). The teacher was labelled with NO route and its turn
  # direction is opposite to the driver's 17% of the time (D-038). Direction
  # only - it must not leak the speed profile, which is what the CoC is for. At
  # deployment the hint comes from navigation (Bench2Drive supplies commands).
  # Applies to EVERY context this config builds (train, gate, val NLL, 05b/05d).
  route_hint: true
  # Probability that a TRAIN window is served with its frames zeroed. On those
  # samples the CoC/struct losses are masked (a CoC is not to be learned from a
  # blank frame) and only the trajectory loss applies, so the trajectory must be
  # read from ego history + route + the teacher-forced CoC text. That is the
  # mechanism that makes the CoC load-bearing (D-040: forcing "turn left" vs
  # "turn right" moved the heading by ~2 degrees). 0.3 keeps 70% of the CoC
  # gradient; the cost is nil (same forward). Judge on 05d_coc_intervention.py.
  image_dropout: 0.3
  # Drop TRAIN windows whose teacher CoC is flatly contradicted by the driver's
  # future (data/grounding.py, strict scale of eval/gt_reward.py): FOLLOW/KEEP
  # while the driver braked hard from speed (11.3% of the cache), STOP with no
  # stop (3.0%), opposite turn direction (1.5%), TURN/ACCELERATE/SLOW/YIELD
  # contradicted by kinematics (3.1%) - ~18% in all. Pairing those with the GT
  # trajectory would train "say one thing, do another". Soft cases (ADAPT_SPEED
  # on held speed, unparsed traces, silence on a turn) stay. Gate/val: unfiltered.
  filter_contradictions: true
  loss_weights:
    traj_kl: 0.0                             # RUN 7: OFF (was 1.0). The teacher's curvature
                                             # top-k is conditioned on ITS prefix, and the
                                             # trajectory target is now the driver's. Still
                                             # logged (`traj`, `traj_accel`) under no_grad,
                                             # off-policy - read it as a drift indicator only.
    traj_kl_accel: 0.0                       # RUN 7: OFF (was 0.1). Same reason.
    text_kl: 1.0                             # unchanged. Do not raise: 243 drove train text
                                             # to 0.003 while val CoC NLL ROSE (0.648 -> 0.921).
    feat: 0.0                                # inert (D-033) and, at 1 camera, mis-pooled;
                                             # left off at 4 cameras too - not load-bearing.
    gt_ce: 1.0                               # RUN 7: ON, flat (was 0.0; run 4 ramped 0.5 ->
                                             # 1.5). Soft target (gt_traj_soft_ce, sigma
                                             # below): CE against a Gaussian over the bins
                                             # neighbouring the GT bin, the shape D-035 found
                                             # a one-hot over 3000 bins cannot learn. Floors
                                             # at ~3.21 nats, NOT 0 - do not read a plateau
                                             # there as failure; `gt` logs the one-hot CE.
                                             # No `gt_ce_end`: no ramp. Do not add one.
    struct_ce: 0.5                           # unchanged: CE on `<|cot_end|><|traj_future_start|>`
                                             # so the CoC terminates (D-034).
  gt_soft_sigma_bins: 6.0                    # run 4: sigma of the GT anchor's Gaussian, in bins,
                                             # truncated at +/-3 sigma, renormalised at the
                                             # region edges.
  feat_warmup_frac: 0.1
  select_on: minade                          # RUN 7: back to minADE (run 5-6 used coc_nll).
                                             # GT tokens are trained toward again, so the
                                             # gate is a trained-toward metric; and D-036
                                             # found val CoC NLL a poor early-stop signal
                                             # (moves on phrasing, turned at epoch 1 while
                                             # free-running content was still improving).
                                             # minADE noise: +/-0.078 m over 3 seeds on one
                                             # checkpoint - hence patience 3 and adapters
                                             # saved every epoch for offline scoring.
  early_stop_patience: 3
  save_every_epoch: true                     # RUN 7, NEW: adapters (~75 MB) at every epoch
                                             # under runs/stage1/run-<job>/epoch-NN, so any
                                             # epoch can be free-run scored (05b) and
                                             # intervention-tested (05d) after the fact.
  # Maneuver-stratified sampling (D-036, data/sampling.py). OFF since the run-6
  # outcome: the reweighted marginal was learned at epoch 0 and the collapse
  # returned at epoch 1; the collapse is a perception limit, not a frequency.
  # Kept for a later ablation.
  maneuver_sampling:
    enabled: false
    alpha: 0.5

# PHASE 1.5 (D-037): GRPO on the AR tower's chain-of-causation. Separate from
# phase 2's DiffGRPO on the flow head. Why RL here at all: `text_kl` is hard-label
# CE on ONE sampled teacher trace, and 05c/05b measured the student holding only
# ~0.1-0.25 on the teacher's verb where the teacher commits (nudge / adapt / lane
# change) - an under-sharpened conditional that CE cannot sharpen and that
# group-relative reward can. It is also how the teacher got its own CoC
# (Alpamayo 1.5: RL with a reasoning reward on the chain-of-causation).
# Runs on one GPU, no vLLM: 2B student, ~14-token rollouts, cache-only inputs.
#   python -m distill.train_grpo_coc --smoke        # Ada, ~15 min
#   sbatch scripts/03c_grpo_coc.sh                  # Blackwell
stage1_rl:
  # RUN 2 of the RL stage (D-038). Run 1 (job 316) on the teacher-match reward
  # fixed the collapse by step 75 and then learned the teacher's narration:
  # object recall up, precision down, GT-consistency down, SLOW/YIELD/TURN
  # 40-80% OVER the teacher's rate. Measured against the driver's own future,
  # the teacher's hazard mentions predict nothing (70% vs 69% reaction rate with
  # vs without one) and its turn direction is opposite 17% of the time (no
  # route). So: grade against what the driver did and tell the student the route.
  # RUN 2 FOLLOWS THE RECIPE'S SHAPE (D-039): the rollout is CoC + trajectory
  # tokens in one completion (`generate_coc_and_traj`), and the primary reward is
  # the decoded trajectory's ADE against the driver's future - the CoC earns
  # credit through the plan it leads to, which is how alpamayo1_x_rl trains it.
  # The kinematic / direction text checks stay as small shaping terms and as
  # teacher-free EVALUATION metrics; they are no longer the objective.
  # RUN 3 (user, 2026-09-14): the same recipe on the FOUR cameras the labels were
  # made with. Run 2 (job 317, 1 camera, run-314 init): val ADE 5.26 -> 4.54 m,
  # route read 0.08 -> 0.50, FOLLOW 79 -> 49 / LANE_CHANGE 2 -> 21 on 200 windows;
  # GT-consistency of the stated maneuver flat at ~0.70. Run 3 asks how much of
  # the remaining gap is the single view. Same reward, same route hint.
  # RUN 4 (2026-09-15, D-040): run 3 (job 320) moved val ADE 3.79 -> ~3.4-3.7 m
  # and the CoC not at all (FOLLOW 53 at every check, route read 0.18 flat), and
  # 05d_coc_intervention shows why: the student's plan does not depend on its
  # own CoC (forcing "turn left" vs "turn right" moves the decoded heading 2-6
  # deg; "stop" vs "accelerate" moves end speed 0-1.4 m/s). One ADE advantage on
  # both spans trains the trajectory tokens and feeds the CoC noise. So: reward
  # mode `perspan` - two rewards per joint rollout, each group-normalised on its
  # own: ADE -> the trajectory span, the GT-grounded text rules -> the CoC span,
  # and a SELF-CONSISTENCY term (the stated maneuver/direction scored against the
  # kinematics of the student's own decoded plan) on both - the one term that
  # builds the coupling instead of assuming it. The CoC is sampled at T=1.0 in
  # rollouts so the sharp 4-camera student's 16 rollouts differ; val keeps 0.6.
  # RUN 5 (2026-09-17, D-042). Run 4 (job 325) was stopped at step 75/200: flat,
  # for a reason that is not the reward's shape. Measured there, ONE LoRA delta
  # norm is identical to run 3's at the same step (0.148 vs 0.150 at step 50) but
  # the resulting KL is 5-10x below the 1-camera runs that moved metrics (run 1
  # 0.0050, run 2 0.0025, runs 3/4 0.00044/0.00047 at steps 51-75). The 4-camera
  # init absorbs the same parameter displacement with far less change in its
  # output distribution, so at lr 1e-5 NO reward is observable. TWO changes are
  # therefore made together - the rate is what makes the reward legible:
  #   1. lr 1e-5 -> 5e-5 (delta scales with lr, KL with delta^2: projects to
  #      ~0.04 at step 200, just past run 2's proven 0.025 endpoint).
  #   2. the CoC reward drops to its grounded subset: hazard 0.5 -> 0 and
  #      teacher 0.25 -> 0 (see gt_reward.hazard_term / D-042 - together they
  #      were 54% of the positive reward and both pay for narration), and `kin`
  #      moves to the hedge-free `strict` scale.
  # Also eval_windows 150 -> 400: two evaluations of the IDENTICAL checkpoint
  # (run 3 step 0 vs run 4 step 0) differed by 0.08 gt_score and 0.35 m ADE, so
  # 150-window selection was a lottery. 400 cuts that to ~0.05.
  init_ckpt: /data/vla/alpamayo2edge/runs/stage1/run-253/best   # 4-camera-native SFT (r96+MLP,
                                             # merged); fresh r48 attention adapters on top are
                                             # the policy, the merged weights the reference
  run_name: rl-run-5-grounded
  cameras: [camera_cross_left_120fov, camera_front_wide_120fov, camera_cross_right_120fov,
            camera_front_tele_30fov]         # RL-only override of data.cameras (1 cam for SFT)
  route_hint: true                           # <|route_start|>Turn left ahead<|route_end|> etc.,
                                             # derived from gt_future_xyz (direction only)
  group_size: 16
  prompts_per_step: 8                        # joint rollouts are ~145 tokens, not ~14: half the
                                             # prompts per step to hold the step near 3-4 min
  prompt_alpha: 0.5
  steps: 200                                 # run 1 had what it could get by ~75-150 steps
  traj_loss_weight: 1.0                      # trajectory span's PG term relative to the CoC's
                                             # (each span is mean-normalised on its own)
  score_chunk: 4                             # rows per scoring forward (grad accumulation); 4 cams
                                             # make a row ~3x longer than 1 cam (run 2 used 8 at
                                             # 42 GB on the Blackwell)
  lr: 5.0e-5                                 # 5x run 4 (D-042): at 1e-5 the 4-camera init moves
                                             # 0.0005 nats in 50 steps and nothing is measurable
  grad_clip: 1.0
  kl_beta: 0.03
  ce_aux: 0.1
  temperature: 0.6
  top_p: 0.98
  coc_temperature: 1.0                       # run 4: CoC phase of the ROLLOUT only. The trajectory
                                             # bins and every val decode stay at `temperature`
  max_new_tokens: 64
  eval_every: 25
  eval_windows: 400                          # each val window decodes a trajectory on 4-camera
                                             # contexts (~3x run 2's cost per window). 150 gave a
                                             # +/-0.08 gt_score noise floor, measured by evaluating
                                             # one checkpoint twice; 400 gives ~0.05 for ~1 h more
                                             # over the run. Final calls still get 500 offline
  select_on: gt_score                        # run 4: the CoC is what this run is for (run 3
                                             # selected on neg_ade and its val curve was flat
                                             # noise, +/-0.3 m on 150 windows). ADE is logged
                                             # alongside; every eval also keeps its adapters
  seed: 0
  reward:
    mode: perspan                            # perspan (run 4, D-040) | traj (D-039, the recipe)
                                             # | gt (text rules) | teacher (run 1's grader)
    self_consistency: 0.5                    # perspan only: x (kinematic + direction term of the
                                             # CoC against the student's OWN decoded plan), in
                                             # [-2, 2]; added to BOTH spans' rewards. 0.5 puts it
                                             # at the ADE term's scale on the trajectory side
    ade: 1.0                                 # x (-min(ADE, ade_cap) / ade_cap), in [-1, 0]
    ade_cap: 8.0                             # the recipe gates at 3 m; here it is a CAP, and a
                                             # high one: the token path lives at 3-5 m (teacher's
                                             # own: 3.77 m ADE_1 on the gate windows; SFT val
                                             # single-sample 4.5 m), and a 3 m cap saturated the
                                             # term at -1 for most samples in the smoke - the gate
                                             # problem re-entering. 8 m keeps within-group ADE
                                             # differences carrying gradient; past 8 m the plan is
                                             # garbage either way
    # CoC-span reward (perspan) / shaping terms (traj). Run 4 uses the `gt`
    # grader's weights: in perspan mode these ARE the CoC's objective, and at
    # run 3's 0.25 they would be swamped by the self-consistency term.
    kin: 1.0                                 # stated maneuver vs the driver's speed/path, on the
                                             # hedge-free `strict` scale (D-042): FOLLOW/KEEP no
                                             # longer collect +0.5 for an uneventful window (74% of
                                             # them) and ADAPT_SPEED drops to +0.5 so it cannot tie
                                             # a correct specific claim (it did in 63% of windows)
    dir: 0.5                                 # stated direction vs the direction taken
    hazard: 0.0                              # OFF (D-042). `reacted` is true in 73% of val
                                             # windows, so within a group this is a +0.69 bounty
                                             # on naming any object - D-038's narration failure
                                             # from the GT side. Kept as the metric only
    teacher: 0.0                             # OFF (D-042). Was 29% of run 4's positive CoC
                                             # reward, for agreeing with a trace whose turn
                                             # direction is opposite 17% of the time (D-038)
    # run-1 grader fields, still read when mode: teacher
    maneuver: 1.0
    direction: 0.5
    objects: 0.5
    false_clear: 1.0
    fail: -2.0                               # unterminated CoC or no trajectory: below any success
    max_tokens: 48

stage2:
  supervision: teacher_flow                  # teacher_flow (D-007) | gt_flow (ablation baseline)
  epochs: 8
  micro_batch: 8                             # was 4; same LoRA headroom as stage 1
  grad_accum: 4                              # effective batch held at 32
  lr: 5.0e-5
  warmup_frac: 0.03
  weight_decay: 0.0
  grad_checkpoint: true
  loss_weights:
    flow_distill: 1.0
    fm_gt: 0.5
  anneal_to_gt_frac: 0.2                     # last 20%: ramp fm_gt up, flow_distill down
  scheduled_sampling_start_frac: 0.5         # after 50%: condition on student-sampled traj tokens

eval:
  horizon_s: 6.4
  minade_k: 6
  # The gate decodes 128 tokens x minade_k modes per window at batch 1 (see
  # eval/coarse_minade.py for why batch 1), so it is minutes, not seconds. Cap
  # the window count to keep a per-epoch signal cheap; null = the whole split.
  gate_max_windows: 60
  challenging_split: challenging_v1          # NVIDIA's hard samples, held out from training
                                             # NOTE: unused - the PhysicalAI-AV metadata
                                             # carries no such flag, so split_challenging.json
                                             # is the long-tail STRATA of the val split
                                             # (data/splits.py). Rename or wire when a real
                                             # challenging-split id list exists.
  # Retention (D-025, TRAINING_STRATEGY §4): half the headline result, not hygiene.
  # Baseline is cached from the UNTRAINED Edge checkpoint once, so base and
  # trained never have to be resident together.
  retention:
    baseline_dir: /data/vla/alpamayo2edge/runs/retention_base
    probe_file: src/distill/eval/probes/general_probes.json
    max_new_tokens: 64
    # Gen-tower denoising retention on non-AV clips. Leave null to skip that
    # half with a warning; any directory of short mp4/webm clips works.
    generic_clips_dir: null
    n_generic_clips: 16
    flow_probe_timesteps: [0.1, 0.3, 0.5, 0.7, 0.9]
    seed: 0

# NOTE: no EMA anywhere by design (TRAINING_STRATEGY §3). NVIDIA's Edge recipe
# enables it, but that is an 8-GPU config with fsdp_master_dtype float32; here it
# would cost a full extra weight copy for no benefit at LoRA scale.
